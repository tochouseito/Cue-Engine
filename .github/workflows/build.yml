name: build-windows

on:
  push:
    branches:
      - release
      - develop
  pull_request:

jobs:
  build:
    runs-on: windows-2025-vs2026

    strategy:
      fail-fast: false
      matrix:
        config: [Debug, RelWithDebInfo, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -G "Visual Studio 18 2026"
          -A x64
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: >
          cmake --build build
          --config ${{ matrix.config }}
          --parallel

      - name: Test
        working-directory: build
        run: >
          ctest
          -C ${{ matrix.config }}
          --output-on-failure
