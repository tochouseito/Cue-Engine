name: _build-common

on:
  workflow_call:
    inputs:
      config:
        required: true
        type: string

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -G "Visual Studio 18 2026"
          -A x64
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: >
          cmake --build build
          --config ${{ inputs.config }}
          --parallel

      - name: Test
        working-directory: build
        run: >
          ctest
          -C ${{ inputs.config }}
          --output-on-failure
